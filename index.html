  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;buffett-focus&quot; class=&quot;focus-app&quot;&gt;
  &lt;style&gt;

    #buffett-focus .notice { padding: 12px 14px; background: var(--accent); color: var(--accent-foreground); margin: 0 0 20px; line-height: 1.55; }
    #buffett-focus .priority-list { display: grid; gap: 12px; }
    #buffett-focus .priority-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; padding: 16px 0; border-top: 1px solid var(--border); }
    #buffett-focus .rank { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); font-size: .9rem; }
    #buffett-focus .priority-title { font-weight: 500; margin: 7px 0 14px; }

    #buffett-focus .actions .spacer { flex: 1; }
    #buffett-focus .overview { display: grid; grid-template-columns: 1.25fr .75fr; gap: 32px; align-items: start; }
    #buffett-focus .chart-wrap { min-width: 0; }

    #buffett-focus .chart .ring { fill: none; stroke: var(--border); }

    #buffett-focus .chart .area { fill: var(--viz-series-1); fill-opacity: .18; stroke: var(--viz-series-1); stroke-width: 2.5; stroke-linejoin: round; }
    #buffett-focus .chart .dot { fill: var(--viz-series-1); }
    #buffett-focus .chart text { fill: var(--foreground); font-size: 12px; }
    #buffett-focus .chart .label { fill: var(--muted-foreground); font-size: 11px; }
    #buffett-focus .focus-list { list-style: none; padding: 0; margin: 0; }
    #buffett-focus .focus-list li { padding: 14px 0; border-top: 1px solid var(--border); }
    #buffett-focus .focus-list strong { display: block; font-weight: 500; margin-bottom: 4px; }
    #buffett-focus .focus-list span { color: var(--muted-foreground); font-size: .87rem; }
    #buffett-focus .avoid { color: var(--muted-foreground); line-height: 1.65; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
    #buffett-focus .empty { color: var(--muted-foreground); padding: 28px 0; }
    #buffett-focus .print-title { display:none; }
    @media (max-width: 600px) { #buffett-focus .process { grid-template-columns: repeat(2, 1fr); } #buffett-focus .goals-grid, #buffett-focus .selection-grid, #buffett-focus .overview { grid-template-columns: 1fr; } #buffett-focus .prompt-grid { grid-template-columns: repeat(2, 1fr); } #buffett-focus .prompt:nth-child(2) { border-right: 0; } #buffett-focus .prompt { padding-bottom: 10px; } #buffett-focus .plan-fields { grid-template-columns: 1fr; } #buffett-focus .actions .spacer { display:none; flex-basis:100%; } }
    @media print { #buffett-focus .hero, #buffett-focus .process, #buffett-focus .actions, #buffett-focus .notice { display:none !important; } #buffett-focus .panel { display:none !important; } #buffett-focus #panel-result { display:block !important; } #buffett-focus .print-title { display:block; font-size:25px; margin:0 0 20px; } #buffett-focus .overview { grid-template-columns:1.2fr .8fr; } }
  &lt;/style&gt;

  &lt;section class=&quot;hero&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;THE 25 / 5 FOCUS METHOD&lt;/p&gt;
    &lt;h1&gt;把真正重要的事，排進你的生活。&lt;/h1&gt;
    &lt;p class=&quot;lede&quot;&gt;巴菲特的 25-5 思考法不是要做更多，而是練習排除。花幾分鐘寫下 25 個目標，留下最重要的 5 個，並為它們安排下一步。&lt;/p&gt;
  &lt;/section&gt;

  &lt;nav class=&quot;process&quot; aria-label=&quot;建立計畫的步驟&quot;&gt;
    &lt;div class=&quot;step is-current&quot; data-step=&quot;0&quot;&gt;&lt;b&gt;01&lt;/b&gt;列出目標&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-step=&quot;1&quot;&gt;&lt;b&gt;02&lt;/b&gt;選出五項&lt;/div&gt;
    &lt;div class=&quot;step&quot; data-step=&quot;2&quot;&gt;&lt;b&gt;03&lt;/b&gt;排序與行動&lt;/div&gt;

  &lt;/nav&gt;

  &lt;main&gt;
    &lt;section class=&quot;panel is-active&quot; id=&quot;panel-goals&quot;&gt;
      &lt;h2&gt;寫下你的 25 個目標&lt;/h2&gt;
      &lt;p class=&quot;sub&quot;&gt;不必完美。寫下所有你真正想投入的事：工作、健康、關係、學習或人生計畫。任何想完成的小事情也都可以寫下來，先盡量把腦中的想法完整放進清單。&lt;/p&gt;
      &lt;div class=&quot;prompt-grid&quot; aria-label=&quot;目標發想方向&quot;&gt;
        &lt;div class=&quot;prompt&quot;&gt;&lt;strong&gt;家庭&lt;/strong&gt;&lt;span&gt;想成為怎樣的家人？你想和誰共創哪些回憶？&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;prompt&quot;&gt;&lt;strong&gt;健康&lt;/strong&gt;&lt;span&gt;你希望幾年後擁有怎樣的身體、精力與生活節奏？&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;prompt&quot;&gt;&lt;strong&gt;財務&lt;/strong&gt;&lt;span&gt;你想建立什麼安全感、選擇權，或資產里程碑？&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;prompt&quot;&gt;&lt;strong&gt;人脈&lt;/strong&gt;&lt;span&gt;哪些關係值得更深耕？你想成為誰可靠的夥伴？&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;prompt&quot;&gt;&lt;strong&gt;事業&lt;/strong&gt;&lt;span&gt;你想創造什麼價值？下一個值得投入的專業突破是什麼？&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;goals-grid&quot; id=&quot;goals-grid&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;actions&quot;&gt;&lt;span class=&quot;spacer&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn btn-primary&quot; type=&quot;button&quot; id=&quot;to-select&quot;&gt;下一步：圈選最重要的 5 項&lt;/button&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;panel&quot; id=&quot;panel-select&quot;&gt;
      &lt;h2&gt;只能留下五項&lt;/h2&gt;

      &lt;div class=&quot;counter&quot; id=&quot;counter&quot;&gt;已選 0 / 5&lt;/div&gt;

      &lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-back=&quot;0&quot;&gt;返回修改&lt;/button&gt;&lt;span class=&quot;spacer&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn btn-primary&quot; type=&quot;button&quot; id=&quot;to-plan&quot;&gt;下一步：安排優先順序&lt;/button&gt;&lt;/div&gt;

    &lt;/section&gt;

    &lt;section class=&quot;panel&quot; id=&quot;panel-result&quot;&gt;
      &lt;h2 class=&quot;print-title&quot;&gt;我的 25-5 聚焦計畫&lt;/h2&gt;
      &lt;div class=&quot;notice&quot;&gt;&lt;strong&gt;你的規則：&lt;/strong&gt;其餘 20 項並非不重要；但在這 5 項完成或達到階段成果前，它們不取得你的主要時間。&lt;/div&gt;

          &lt;svg class=&quot;chart&quot; id=&quot;focus-chart&quot; viewBox=&quot;0 0 460 410&quot; role=&quot;img&quot; aria-label=&quot;五個焦點目標的優先順序雷達圖&quot;&gt;
            &lt;title&gt;我的五項核心聚焦&lt;/title&gt;&lt;desc&gt;圓形圖表呈現五個已排序的優先目標。&lt;/desc&gt;

        &lt;div&gt;
          &lt;ol class=&quot;focus-list&quot; id=&quot;focus-list&quot;&gt;&lt;/ol&gt;

        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-back=&quot;2&quot;&gt;調整計畫&lt;/button&gt;&lt;span class=&quot;spacer&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;download-png&quot;&gt;下載圖表 PNG&lt;/button&gt;&lt;button class=&quot;btn btn-primary&quot; type=&quot;button&quot; id=&quot;print-plan&quot;&gt;列印／另存 PDF&lt;/button&gt;&lt;/div&gt;

  &lt;/main&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;buffett-focus&#x27;);
      const key = &#x27;buffett-25-5-focus-v1&#x27;;
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(key) || &#x27;null&#x27;); } catch (_) {}
      const state = saved || { goals: Array(25).fill(&#x27;&#x27;), selected: [], plans: {} };
      const $ = s =&gt; root.querySelector(s);
      const esc = s =&gt; String(s).replace(/[&amp;&lt;&gt;&quot;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;}[c]));
      const save = () =&gt; { try { localStorage.setItem(key, JSON.stringify(state)); } catch (_) {} };
      const currentGoals = () =&gt; state.goals.map((g, i) =&gt; ({ text: g.trim() || `未命名目標 ${i + 1}`, index: i }));
      function show(step) {
        root.querySelectorAll(&#x27;.panel&#x27;).forEach((p, i) =&gt; p.classList.toggle(&#x27;is-active&#x27;, i === step));
        root.querySelectorAll(&#x27;.step&#x27;).forEach((p, i) =&gt; p.classList.toggle(&#x27;is-current&#x27;, i === step));
        if (step === 1) renderSelection(); if (step === 2) renderPlans(); if (step === 3) renderResult();
        root.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
      }
      function renderGoals() {
        $(&#x27;#goals-grid&#x27;).innerHTML = state.goals.map((goal, i) =&gt; `&lt;label class=&quot;goal-field&quot;&gt;&lt;span class=&quot;goal-number&quot;&gt;${String(i+1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;input class=&quot;form-control&quot; maxlength=&quot;80&quot; data-goal=&quot;${i}&quot; value=&quot;${esc(goal)}&quot; placeholder=&quot;我想完成…&quot;&gt;&lt;/label&gt;`).join(&#x27;&#x27;);
        root.querySelectorAll(&#x27;[data-goal]&#x27;).forEach(input =&gt; input.addEventListener(&#x27;input&#x27;, e =&gt; { state.goals[+e.target.dataset.goal] = e.target.value; save(); }));
      }
      function renderSelection() {
        const items = currentGoals();
        $(&#x27;#selection-grid&#x27;).innerHTML = items.map(item =&gt; `&lt;button class=&quot;btn goal-select ${state.selected.includes(item.index) ? &#x27;is-picked&#x27; : &#x27;&#x27;}&quot; type=&quot;button&quot; data-pick=&quot;${item.index}&quot;&gt;&lt;span class=&quot;n&quot;&gt;${String(item.index + 1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;span&gt;${esc(item.text)}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;);
        $(&#x27;#counter&#x27;).textContent = `已選 ${state.selected.length} / 5`;
        root.querySelectorAll(&#x27;[data-pick]&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; {
          const id = +btn.dataset.pick, at = state.selected.indexOf(id);
          if (at &gt;= 0) state.selected.splice(at, 1); else if (state.selected.length &lt; 5) state.selected.push(id); else { $(&#x27;#counter&#x27;).textContent = &#x27;已選 5 項，請先取消其中一項&#x27;; return; }
          save(); renderSelection();
        }));
      }
      function renderPlans() {
        const items = state.selected.map(i =&gt; ({ ...currentGoals()[i], plan: state.plans[i] || {} }));
        $(&#x27;#priority-list&#x27;).innerHTML = items.map((item, pos) =&gt; `&lt;article class=&quot;priority-row&quot;&gt;&lt;div class=&quot;rank&quot;&gt;${pos+1}&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;priority-title&quot;&gt;${esc(item.text)}&lt;/div&gt;&lt;div class=&quot;plan-fields&quot;&gt;&lt;input class=&quot;form-control&quot; data-action=&quot;${item.index}&quot; value=&quot;${esc(item.plan.action || &#x27;&#x27;)}&quot; maxlength=&quot;90&quot; placeholder=&quot;下一個具體行動&quot;&gt;&lt;input class=&quot;form-control&quot; type=&quot;date&quot; data-date=&quot;${item.index}&quot; value=&quot;${esc(item.plan.date || &#x27;&#x27;)}&quot; aria-label=&quot;完成日期&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;`).join(&#x27;&#x27;);
        root.querySelectorAll(&#x27;[data-action]&#x27;).forEach(el =&gt; el.addEventListener(&#x27;input&#x27;, e =&gt; { const p = state.plans[e.target.dataset.action] ||= {}; p.action = e.target.value; save(); }));
        root.querySelectorAll(&#x27;[data-date]&#x27;).forEach(el =&gt; el.addEventListener(&#x27;change&#x27;, e =&gt; { const p = state.plans[e.target.dataset.date] ||= {}; p.date = e.target.value; save(); }));
      }
      function renderResult() {
        const items = state.selected.map((id, pos) =&gt; ({ ...currentGoals()[id], pos, plan: state.plans[id] || {} }));
        $(&#x27;#focus-list&#x27;).innerHTML = items.map(item =&gt; `&lt;li&gt;&lt;strong&gt;${item.pos+1}. ${esc(item.text)}&lt;/strong&gt;&lt;span&gt;${item.plan.action ? esc(item.plan.action) : &#x27;尚未填寫下一步&#x27;}${item.plan.date ? ` · ${item.plan.date}` : &#x27;&#x27;}&lt;/span&gt;&lt;/li&gt;`).join(&#x27;&#x27;);
        const remaining = currentGoals().filter(i =&gt; !state.selected.includes(i.index) &amp;&amp; state.goals[i.index].trim()).length;
        $(&#x27;#avoid-copy&#x27;).textContent = remaining ? `先暫停另外 ${remaining} 個目標，把注意力留給這五件事。` : &#x27;其餘目標會暫時放在清單外，讓這五件事得到完整注意力。&#x27;;
        const cx=230, cy=205, radii=[48,96,144], angle=i =&gt; -Math.PI/2 + i * Math.PI*2/5;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    return tooltip;

  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);

      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };

    autoUpdateCleanup?.();

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

      placement: getPlacement(trigger),

      .then(({ x, y }) =&gt; {

      });

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

      activeTrigger === trigger ||
      pendingTrigger === trigger

    }

    pendingTrigger = trigger;
    const delay =
